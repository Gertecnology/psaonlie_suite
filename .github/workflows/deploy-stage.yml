name: Deploy stage

# GitHub compila y publica la imagen; el servidor sólo la baja y la corre.
#
# El panel se sirve estático: el build de Vite hornea las variables `VITE_*`
# en el bundle, así que pasarlas al contenedor con `-e` no haría nada. Tienen
# que llegar como build-arg, y de ahí a un `ARG` del Dockerfile.
#
# Las nuevas salen del entorno `stage` de este repo (`gh variable set … --env
# stage`), como ya estaban las de la landing. El `.env` versionado se mantiene
# para las viejas: el Dockerfile lo copia antes de compilar y las del proceso
# ganan sobre él.

on:
  workflow_dispatch:
    inputs:
      tag_existente:
        description: >-
          SHA de una imagen ya publicada, para redesplegar sin compilar.
          Vacío = compila la rama elegida arriba.
        required: false
        type: string

concurrency:
  group: deploy-pasaje-suite-stage
  cancel-in-progress: false

env:
  # En minusculas y literal, no `${{ github.repository }}`: la organizacion se
  # escribe `Gertecnology` y GHCR rechaza cualquier tag con mayusculas
  # ("repository name must be lowercase").
  IMAGEN: ghcr.io/gertecnology/psaonlie_suite
  CONTENEDOR: pasaje-online-suite
  # nginx busca el panel en el 3002, y el contenedor sirve en el 3002.
  # El compose del servidor tenía "3000:3002" y el 3000 estaba ocupado por otro
  # proyecto: por eso el sitio devolvía 502.
  PUERTO_HOST: 3002
  PUERTO_CONTENEDOR: 3002
  URL_SALUD: https://suite-pasaje.gertecnology.com

jobs:
  construir:
    name: Construir y publicar
    runs-on: ubuntu-latest
    if: inputs.tag_existente == ''
    # Las `vars` de un entorno sólo llegan al job que lo declara. Sin esta
    # línea, `vars.VITE_BANCARD_SDK_URL` viaja vacía y el build hornea un
    # `undefined` en el bundle, que es exactamente el bug que se está
    # arreglando —sólo que sin mensaje.
    environment: stage
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Las variables de aplicacion salen del entorno `stage` del repo, no
          # del `.env` versionado. Vite las hornea en el bundle durante el
          # build, asi que tienen que llegar como build-arg: pasarlas al
          # contenedor con `-e` no haria nada.
          build-args: |
            VITE_BANCARD_SDK_URL=${{ vars.VITE_BANCARD_SDK_URL }}
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:stage-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar
    runs-on: ubuntu-latest
    needs: [construir]
    if: always() && (needs.construir.result == 'success' || inputs.tag_existente != '')
    environment: stage
    steps:
      - name: Bajar la imagen y levantarla
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVIDOR_HOST }}
          username: ${{ secrets.SERVIDOR_USER }}
          key: ${{ secrets.SERVIDOR_SSH_KEY }}
          envs: IMAGEN,CONTENEDOR,PUERTO_HOST,PUERTO_CONTENEDOR,TAG,TOKEN,ACTOR
          script: |
            set -e

            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            docker pull "$IMAGEN:$TAG"

            docker rm -f "$CONTENEDOR" 2>/dev/null || true
            docker run -d \
              --name "$CONTENEDOR" \
              --restart unless-stopped \
              -p "$PUERTO_HOST:$PUERTO_CONTENEDOR" \
              "$IMAGEN:$TAG"

            docker image prune -f
        env:
          TAG: ${{ inputs.tag_existente || github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}

  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    needs: [desplegar]
    steps:
      - name: Esperar a que responda
        run: |
          for intento in $(seq 1 12); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL_SALUD" || echo 000)
            if [ "$codigo" = "200" ]; then
              echo "Responde 200 en el intento $intento."
              exit 0
            fi
            echo "Intento $intento: HTTP $codigo. Reintento en 10 s."
            sleep 10
          done

          echo "No respondió 200 en 12 intentos. El despliegue queda marcado como fallido."
          exit 1
        env:
          URL_SALUD: ${{ env.URL_SALUD }}
